<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14213d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0b0b0c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="25%" stop-color="#d4af75"/>
      <stop offset="50%" stop-color="#fef0cd"/>
      <stop offset="75%" stop-color="#b88f4b"/>
      <stop offset="100%" stop-color="#8a6727"/>
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e5e4e2"/>
      <stop offset="60%" stop-color="#f5f5f5"/>
      <stop offset="85%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#8c8c8c"/>
    </linearGradient>

    <!-- Emerald Gem Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#55e6a5"/>
      <stop offset="50%" stop-color="#0b8457"/>
      <stop offset="100%" stop-color="#043c26"/>
    </radialGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b92"/>
      <stop offset="50%" stop-color="#bd183a"/>
      <stop offset="100%" stop-color="#540515"/>
    </radialGradient>

    <!-- Diamond Sparkle Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  
  <!-- Subtle Luxury Radial Rings -->
  <circle cx="400" cy="270" r="220" fill="none" stroke="#d4af75" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="400" cy="270" r="160" fill="none" stroke="#e5e4e2" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,6"/>

  <!-- Artwork Container -->
  <g transform="translate(400, 260)">
    
  <!-- Silver Platter Base -->
  <ellipse cx="0" cy="20" rx="150" ry="110" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="6" filter="url(#glow)"/>
  <ellipse cx="0" cy="20" rx="125" ry="90" fill="#0b0b0c" stroke="url(#silverGrad)" stroke-width="4"/>
  <ellipse cx="0" cy="20" rx="100" ry="70" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Engraved Floral Center -->
  <circle cx="0" cy="20" r="24" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="2"/>
  <circle cx="0" cy="20" r="10" fill="#0b0b0c"/>

  <!-- Diya (Oil Lamp) on Thali -->
  <g transform="translate(-55, 10)">
    <path d="M-15,5 C-15,-8 15,-8 15,5 Z" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Flame -->
    <path d="M0,-5 Q-6,-18 0,-26 Q6,-18 0,-5 Z" fill="#ffb703" filter="url(#glow)"/>
    <path d="M0,-8 Q-3,-16 0,-22 Q3,-16 0,-8 Z" fill="#ffffff"/>
  </g>

  <!-- Kalash Pot on Thali -->
  <g transform="translate(55, 10)">
    <ellipse cx="0" cy="10" rx="16" ry="12" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="url(#silverGrad)"/>
    <circle cx="0" cy="-8" r="8" fill="url(#rubyGrad)"/>
  </g>

  <!-- Pooja Bell (Ghanti) on Thali -->
  <g transform="translate(0, -30)">
    <path d="M-10,12 C-10,0 -4,-15 0,-25 C4,-15 10,0 10,12 Z" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  </g>

  <!-- Authentic Watermark & Title Pill -->
  <g transform="translate(400, 520)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0b0b0c" fill-opacity="0.8" stroke="#d4af75" stroke-opacity="0.3"/>
    <text x="0" y="-3" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#f8f5ef" letter-spacing="1">Silver Nakshi Pooja Thali Set</text>
    <text x="0" y="14" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4af75" letter-spacing="2">925 Pure Silver · 380 g</text>
  </g>

  <!-- Brand Trust Seal -->
  <g transform="translate(50, 50)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#d4af75" stroke-opacity="0.4"/>
    <text x="20" y="24" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="#d4af75">SBJ</text>
  </g>
  <text x="80" y="74" font-family="sans-serif" font-size="10" fill="#e5e4e2" fill-opacity="0.6" letter-spacing="1">AUTHENTIC ATELIER COLLECTION</text>
</svg>