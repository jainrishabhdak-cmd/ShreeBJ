<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14213d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0b0b0c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="25%" stop-color="#d4af75"/>
      <stop offset="50%" stop-color="#fef0cd"/>
      <stop offset="75%" stop-color="#b88f4b"/>
      <stop offset="100%" stop-color="#8a6727"/>
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e5e4e2"/>
      <stop offset="60%" stop-color="#f5f5f5"/>
      <stop offset="85%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#8c8c8c"/>
    </linearGradient>

    <!-- Emerald Gem Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#55e6a5"/>
      <stop offset="50%" stop-color="#0b8457"/>
      <stop offset="100%" stop-color="#043c26"/>
    </radialGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b92"/>
      <stop offset="50%" stop-color="#bd183a"/>
      <stop offset="100%" stop-color="#540515"/>
    </radialGradient>

    <!-- Diamond Sparkle Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  
  <!-- Subtle Luxury Radial Rings -->
  <circle cx="400" cy="270" r="220" fill="none" stroke="#d4af75" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="400" cy="270" r="160" fill="none" stroke="#e5e4e2" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,6"/>

  <!-- Artwork Container -->
  <g transform="translate(400, 260)">
    
  <!-- Hanging Chain -->
  <path d="M-100,-130 C-40,-50 -20,0 0,20 C20,0 40,-50 100,-130" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Medallion Outer Petals -->
  <circle cx="0" cy="40" r="70" fill="#0b0b0c" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="0" cy="40" r="50" fill="url(#goldGrad)" stroke="#8a6727" stroke-width="2"/>
  
  <!-- Central Ruby Jewel -->
  <circle cx="0" cy="40" r="26" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Uncut Polki Diamonds Ring -->
  <circle cx="48" cy="40" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="33.941125496954285" cy="73.94112549695427" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="2.9391523179536475e-15" cy="88" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="-33.94112549695428" cy="73.94112549695429" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="-48" cy="40.00000000000001" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="-33.941125496954285" cy="6.058874503045722" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="-8.817456953860943e-15" cy="-8" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/><circle cx="33.94112549695427" cy="6.058874503045715" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Basra Pearl Fringe Drops -->
  <circle cx="0" cy="130" r="8" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="0" y1="110" x2="0" y2="122" stroke="url(#goldGrad)" stroke-width="2"/>

  <circle cx="-30" cy="120" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="-30" y1="102" x2="-30" y2="114" stroke="url(#goldGrad)" stroke-width="2"/>

  <circle cx="30" cy="120" r="6" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="30" y1="102" x2="30" y2="114" stroke="url(#goldGrad)" stroke-width="2"/>

  </g>

  <!-- Authentic Watermark & Title Pill -->
  <g transform="translate(400, 520)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0b0b0c" fill-opacity="0.8" stroke="#d4af75" stroke-opacity="0.3"/>
    <text x="0" y="-3" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#f8f5ef" letter-spacing="1">Kundan Jadau Medallion Set</text>
    <text x="0" y="14" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4af75" letter-spacing="2">22K BIS Hallmarked · 32.0 g</text>
  </g>

  <!-- Brand Trust Seal -->
  <g transform="translate(50, 50)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#d4af75" stroke-opacity="0.4"/>
    <text x="20" y="24" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="#d4af75">SBJ</text>
  </g>
  <text x="80" y="74" font-family="sans-serif" font-size="10" fill="#e5e4e2" fill-opacity="0.6" letter-spacing="1">AUTHENTIC ATELIER COLLECTION</text>
</svg>